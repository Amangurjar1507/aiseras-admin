<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login - MathAdventure</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>body{display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg, #032646, #07477e);background-size: cover;
    background-position: center;}.login-card{width:420px}</style>
</head>
<body>
  <div class="d-flex align-items-center justify-content-center" style="min-height:100vh;padding:2rem">
    <div class="login-card card shadow-sm">
      <div class="card-body">
        <div class="text-center mb-3"><img src="assets/images/logo.png" alt="logo" style="width:180px;max-width:80%"></div>
        <h5 class="card-title text-center">Admin Login</h5>
        
        <form action="admin-dashboard.html" method="post">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="admin@example.com">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" placeholder="••••••">
          </div>
          <div class="mb-3">
            <label class="form-label"><input type="checkbox"> Remember Me</label>
            
          </div>
          <div class="d-flex justify-content-between align-items-center">
           
            <button class="btn btn-primary w-100 p-2">Login</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
